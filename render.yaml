services:
  - type: web
    name: skylark-bi-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONDAY_API_TOKEN
        sync: false
      - key: DEALS_BOARD_ID
        value: 5030966894
      - key: WORK_ORDERS_BOARD_ID
        value: 5030966898
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
